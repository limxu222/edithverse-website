<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 24" width="168" height="24" role="img" aria-label="edithverse">
  <!-- Horizontal lockup. Nav bar, footer, email signature. Minimum width 120px.
       Clear space on all sides = 12 units (half the mark's width). -->
  <mask id="evBandsH">
    <rect width="24" height="24" fill="#000"/>
    <g fill="#fff">
      <rect y="0"     width="24" height="2.54"/>
      <rect y="3.58"  width="24" height="2.54"/>
      <rect y="7.15"  width="24" height="2.54"/>
      <rect y="10.73" width="24" height="2.54"/>
      <rect y="14.30" width="24" height="2.54"/>
      <rect y="17.88" width="24" height="2.54"/>
      <rect y="21.46" width="24" height="2.54"/>
    </g>
  </mask>
  <circle cx="12" cy="12" r="12" fill="currentColor" mask="url(#evBandsH)"/>
  <text x="40" y="17.4"
        font-family="Inter, Geist, Satoshi, ui-sans-serif, system-ui, sans-serif"
        font-size="16" font-weight="500" letter-spacing="1.6"
        fill="currentColor">EDITHVERSE</text>
</svg>
