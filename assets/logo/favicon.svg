<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Mark alone on an --ev-bg plate so it holds in both light and dark
       browser chrome. Colours are fixed here because a favicon has no
       currentColor to inherit. -->
  <mask id="evBandsFav">
    <rect x="4" y="4" width="24" height="24" fill="#000"/>
    <g fill="#fff">
      <rect x="4" y="4"     width="24" height="2.54"/>
      <rect x="4" y="7.58"  width="24" height="2.54"/>
      <rect x="4" y="11.15" width="24" height="2.54"/>
      <rect x="4" y="14.73" width="24" height="2.54"/>
      <rect x="4" y="18.30" width="24" height="2.54"/>
      <rect x="4" y="21.88" width="24" height="2.54"/>
      <rect x="4" y="25.46" width="24" height="2.54"/>
    </g>
  </mask>
  <rect width="32" height="32" rx="7" fill="#0F0E0D"/>
  <circle cx="16" cy="16" r="12" fill="#F2ECE4" mask="url(#evBandsFav)"/>
</svg>
